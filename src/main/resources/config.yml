endpoint: "play.min.io"
secure: true
accessKey: "MINIO_ACCESS_KEY"
secretKey: "MINIO_SECRET_KEY"
bucket: "schematics"
# Default schematic file extension. Allowed: "schem" (recommended) or "schematic".
extension: "schem"

# Where to place downloaded schematic files on disk
downloadDir: "plugins/SchemFlow/schematics"

# Storage hierarchy (S3 object keys)
storage:
  rootDir: "FlowStack/SchemFlow"   # Root folder prefix in the bucket
  defaultGroup: "default"         # Default group if none provided

# Startup behavior
autoListOnStart: true
# Optional: name of schematic to fetch on start (leave blank to skip)
fetchOnStart: ""

# Schematic cache auto-refresh interval (seconds). Set 0 to disable periodic refresh.
cacheRefreshSeconds: 30

# Light recalculation after a paste.
# FastAsyncWorldEdit relights a paste in the background and nobody is told when it finishes. A round world
# that is unloaded or copied right after its paste (Conduit stages the provisioned world as the map source)
# gets saved before that relight is done: the map has all its blocks but no light, so players see it dark
# everywhere except right next to torches and lamps. SchemFlow relights the pasted chunks through the
# server's light engine (Paper 1.21+) and round provisioning waits for it before it reports the world ready.
lighting:
  # Relight the pasted area after every SchemFlow paste. Set false to leave lighting to (FA)WE alone.
  relightAfterPaste: true
  # Longest a round provisioning waits for the relight before handing the world over anyway.
  maxWaitSeconds: 60
  # Chunks loaded per server tick for the relight. Each costs about half a millisecond of main-thread time
  # (the light math itself runs off the main thread); lower it on a busy server, raise it to relight faster.
  chunksPerTick: 32

# Map exports and round pastes.
maps:
  # Store every block's biome in map exports and paste it back. Without it a provisioned map takes the
  # biomes of the empty world it is pasted into (wrong grass/water/sky colours, rain instead of snow).
  # Only maps exported with this on carry biomes; pasting an older map leaves the world's biomes alone.
  copyBiomes: true
  # Rebuild entities that ride other entities, e.g. models made of block/item/text displays stacked on one
  # root entity. FastAsyncWorldEdit saves each rider twice (nested in its vehicle, and as an empty copy of
  # its own) and pastes only the empty copies, so such models vanish from the map. SchemFlow spawns each
  # vehicle with its riders mounted and skips the empty copies; old schematics are restored as they are.
  restorePassengers: true
  # Entities spawned per server tick while restoring them. Each costs up to about a tenth of a millisecond of
  # main-thread time (the NBT is parsed off it); lower it on a busy server, raise it to restore models faster.
  entitiesPerTick: 128

# Provisioning (WDB replacement)
provisionOnStartup: false
worlds:
  - name: "example_world"
    enabled: false
    flat: true
    generatorSettings: '{"biome": "minecraft:plains","layers": []}'
    schem: "example_world"    # schematic name (without extension)
    pasteAt: "0,64,0"
    gamerules:
      doMobSpawning: false
      doDaylightCycle: false
      doWeatherCycle: false
      announceAdvancements: false
      disableRaids: true
      doFireTick: false
      doPatrolSpawning: false
      doTraderSpawning: false
      doVinesSpread: false
      doWardenSpawning: false
      globalSoundEvents: false
      mobGriefing: false
      randomTickSpeed: 0
      snowAccumulationHeight: 0
      spawnChunkRadius: 0